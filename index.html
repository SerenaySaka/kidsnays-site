<style>
  /* ====== RENKLER — buradan değiştirebilirsiniz ====== */
  :root{
    --bg:#DBCEC1;        /* bej arka plan */
    --bg-2:#E9E0D6;      /* arka plandaki yumuşak ışık */
    --ink:#2B241E;       /* koyu metin */
    --muted:#6A5C4F;
    --accent:#5B3A29;    /* logodaki kahve */
    --line:rgba(43,36,30,.2);
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *,*::before,*::after{box-sizing:inherit;margin:0}
  html,body{height:100%}
  body{
    font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;
    min-height:100%;
    overflow-x:hidden;
  }
  /* arka plandaki büyük yumuşak halka */
  body::before{
    content:"";position:fixed;z-index:0;pointer-events:none;
    width:min(120vw,1100px);aspect-ratio:1;border-radius:50%;
    right:-35%;top:-30%;
    background:radial-gradient(circle,var(--bg-2) 0%,transparent 65%);
  }
  .wrap{
    position:relative;z-index:1;
    width:100%;max-width:1080px;margin:0 auto;
    padding:clamp(20px,4vw,48px);
    flex:1;display:flex;flex-direction:column;
  }
  header{display:flex;align-items:center;justify-content:space-between;gap:16px}
  .logo{display:block;width:min(440px,82vw);height:auto;margin:0 auto 28px}

  main{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:clamp(40px,8vh,96px) 0}
  .status{
    display:inline-flex;align-items:center;gap:10px;
    font-size:.95rem;color:var(--muted);margin-bottom:24px;
  }
  .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);animation:pulse 2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

  h1{
    font-weight:800;
    font-size:clamp(2.2rem,6.5vw,4.5rem);
    line-height:1;
    letter-spacing:-.04em;
  }
  .lead{
    margin-top:20px;max-width:46ch;
    font-size:clamp(1.05rem,1.6vw,1.25rem);line-height:1.55;color:var(--muted);
  }

  /* geri sayım */
  .count{
    margin-top:48px;
    display:grid;grid-template-columns:repeat(4,minmax(0,1fr));
    width:100%;max-width:620px;border-top:1px solid var(--line);
  }
  .unit{padding:18px 0 0}
  .unit + .unit{padding-left:clamp(12px,3vw,28px);border-left:1px solid var(--line)}
  .num{display:block;font-weight:600;font-size:clamp(2rem,6vw,3.5rem);line-height:1;font-variant-numeric:tabular-nums}
  .lbl{display:block;margin-top:8px;font-size:.9rem;color:var(--muted)}

  .actions{margin-top:44px;display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;
    min-height:48px;padding:0 24px;border-radius:999px;
    font:600 1rem/1 inherit;font-family:inherit;text-decoration:none;
    transition:transform .15s ease,background-color .15s ease;
  }
  .btn-primary{background:var(--accent);color:#F7F1EA}
  .btn-primary:hover{transform:translateY(-2px)}
  .btn-ghost{color:var(--ink);border:1px solid var(--line)}
  .btn-ghost:hover{background:rgba(43,36,30,.06)}
  a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

  footer{
    display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;
    padding-top:24px;border-top:1px solid var(--line);
    font-size:.9rem;color:var(--muted);
  }
  footer nav{display:flex;gap:20px}
  footer a{color:var(--muted);text-decoration:none}
  footer a:hover{color:var(--ink)}

  @media (max-width:520px){
    .count{grid-template-columns:repeat(2,minmax(0,1fr))}
    .unit:nth-child(3){padding-left:0;border-left:0}
    .unit:nth-child(n+3){margin-top:18px;border-top:1px solid var(--line)}
    .btn{flex:1 1 100%}
  }
  @media (prefers-reduced-motion:reduce){
    .dot{animation:none}
    .btn{transition:none}
  }
</style>
</head>

<script>
  // ====== AÇILIŞ TARİHİ — buradan değiştirin (YYYY-AA-GGTSS:DD:SS) ======
  const LAUNCH = new Date("2026-10-25T10:00:00+03:00");

  const el = id => document.getElementById(id);
  const pad = n => String(n).padStart(2, "0");
  el("year").textContent = new Date().getFullYear();

  function tick(){
    let diff = Math.max(0, LAUNCH - new Date());
    const d = Math.floor(diff / 864e5); diff %= 864e5;
    const h = Math.floor(diff / 36e5);  diff %= 36e5;
    const m = Math.floor(diff / 6e4);
    const s = Math.floor((diff % 6e4) / 1e3);
    el("d").textContent = pad(d); el("h").textContent = pad(h);
    el("m").textContent = pad(m); el("s").textContent = pad(s);
    if (LAUNCH - new Date() <= 0) {
      document.querySelector(".status").lastChild.textContent = "Yayındayız!";
      clearInterval(timer);
    }
  }
  const timer = setInterval(tick, 1000);
  tick();
</script>
